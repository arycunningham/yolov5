# Based on actual f2_evolve_38 configuration that achieved mAP@0.5=0.663

# Learning rate schedule
lr0: 0.0015          # Evolution found this works better than 0.000132
lrf: 0.05
momentum: 0.937
weight_decay: 0.0005

# Warmup
warmup_epochs: 6.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1

# Loss gains
box: 0.125
cls: 0.5
cls_pw: 1.0
obj: 0.4225          # Lower than default 1.0 (evolution optimized)
obj_pw: 1.0

# Training thresholds
iou_t: 0.3
anchor_t: 4.0
anchors: 3
fl_gamma: 0.0

# Color augmentation
hsv_h: 0.0886        # Hue shift
hsv_s: 0.0220        # Saturation
hsv_v: 0.1251        # Value/brightness

# Geometric augmentation
degrees: 31.97       # Heavy rotation ±32°
translate: 0.7561    # Very heavy translation (75.6%!)
scale: 0.1013        # Scale variation ±10%
shear: 9.94          # Shear ±10°
perspective: 0.0010  # Slight perspective warp

# Flip augmentation
flipud: 0.7895       # 78.95% chance vertical flip
fliplr: 0.2356       # 23.56% chance horizontal flip

# Advanced augmentation
mosaic: 0.8895       # 88.95% mosaic (combines 4 images)
mixup: 0.7617        # 76.17% mixup (blends images)
copy_paste: 0.3738   # 37.38% copy-paste augmentation