# ================================
# Targeted evolution search space
# ================================

# --- Learning Rate & Scheduler ---
lr0: [0.0005, 0.005]     # Initial learning rate — lower than default for stability
lrf: [0.02, 0.1]         # Final learning rate factor — controls decay aggressiveness
warmup_epochs: [2.0, 8.0]   # Warmup period — slower ramp up = more stable convergence
momentum: [0.90, 0.98]   # Momentum — affects convergence smoothness
weight_decay: [0.0002, 0.001] # Regularization to prevent overfitting

# --- Loss Balance ---
box: [0.10, 0.25]        # Box loss gain — critical for improving localization
cls: [0.3, 0.8]          # Class loss gain — adjust to maintain classification balance
obj: [0.7, 1.3]          # Objectness loss — ensures stable training at lower res
iou_t: [0.20, 0.40]      # IoU training threshold — higher = stricter matches

# --- Advanced Stabilizers ---
anchor_t: [2.0, 5.0]     # Anchor multiple threshold — affects anchor matching flexibility
fl_gamma: [0.0, 1.5]     # Focal loss gamma — >0 may improve hard example learning

# --- Augmentation (minimal or off, since dataset is pre-augmented) ---
hsv_h: [0.0, 0.0]        # Fixed at 0 (no color augmentation)
hsv_s: [0.0, 0.0]
hsv_v: [0.0, 0.0]
degrees: [0.0, 0.0]
translate: [0.0, 0.0]
scale: [0.0, 0.0]
shear: [0.0, 0.0]
perspective: [0.0, 0.0]
flipud: [0.0, 0.0]
fliplr: [0.0, 0.0]
mosaic: [0.0, 0.0]
mixup: [0.0, 0.0]
copy_paste: [0.0, 0.0]

# Note:
# - Keeping augmentation fixed removes noise from evolution.
# - This focuses the search on parameters that actually impact convergence and localization accuracy.
