# =========================================
# Static hyperparameters (mid-range values)
# =========================================

# --- Learning Rate & Optimizer ---
lr0: 0.00275              # midpoint between 0.0005 and 0.005
lrf: 0.06                 # midpoint between 0.02 and 0.1
momentum: 0.94            # midpoint between 0.90 and 0.98
weight_decay: 0.0006      # midpoint between 0.0002 and 0.001

# --- Warmup ---
warmup_epochs: 5.0
warmup_momentum: 0.775
warmup_bias_lr: 0.1

# --- Loss Gains ---
box: 0.175
cls: 0.55
cls_pw: 1.0
obj: 1.0
obj_pw: 1.0

# --- IoU and Anchors ---
iou_t: 0.30
anchor_t: 3.5

# --- Advanced ---
fl_gamma: 0.75

# --- Augmentation (fixed at 0 for no-augmentation) ---
hsv_h: 0
hsv_s: 0
hsv_v: 0
degrees: 0.0
translate: 0.0
scale: 0.0
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.0
mosaic: 0.0
mixup: 0.0
copy_paste: 0.0
